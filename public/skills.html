<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office · Skills</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <header class="topbar three">
    <div class="tb-left">
      <div class="brand">OFFICE</div>
      <nav class="nav"><a href="/" data-i18n>Office</a><a href="/tarefas" data-i18n>Tasks</a><a href="/dashboard">Dashboard</a><a href="/skills" class="on">Skills</a><a href="/graphify">Graphify</a></nav>
    </div>
    <div class="usage" id="usage"></div>
    <div class="tb-right">
      <div class="conn on" id="conn" hidden></div>
    </div>
  </header>
  <main class="dash">
    <div class="filters">
      <input id="q" class="search" type="search" placeholder="Search a skill by name or what it does" data-i18n-placeholder autocomplete="off">
      <label for="source" data-i18n>Source</label>
      <select id="source"><option value="" data-i18n>All</option></select>
      <label class="check"><input type="checkbox" id="used"> <span data-i18n>only the ones I used</span></label>
    </div>
    <section class="cards" id="cards"></section>
    <div class="skills-layout">
      <section class="box skill-list-box">
        <h2 data-i18n>Installed skills</h2>
        <div class="sub" id="count"></div>
        <div id="list" class="skill-list"></div>
      </section>
      <section class="box skill-detail" id="detail">
        <p class="muted" data-i18n>Click a skill to see what it does.</p>
      </section>
    </div>
  </main>
  <script type="module" src="skills.js?v=8"></script>
</body>
</html>
