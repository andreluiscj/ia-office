<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
  <header class="topbar three">
    <div class="tb-left">
      <div class="brand">OFFICE</div>
      <nav class="nav"><a href="/" class="on" data-i18n>Office</a><a href="/tarefas" data-i18n>Tasks</a><a href="/dashboard">Dashboard</a><a href="/skills">Skills</a><a href="/graphify">Graphify</a></nav>
    </div>
    <div class="usage" id="usage"></div>
    <div class="tb-right">
      <div class="conn off" id="conn" data-i18n>connecting</div>
    </div>
  </header>
  <main class="office-wrap">
    <div class="banner" id="banner" hidden></div>
    <div class="stage" id="stage">
      <canvas id="office"></canvas>
      <div class="zoom">
        <button id="zoomIn" title="Zoom in" data-i18n-title>+</button>
        <button id="zoomOut" title="Zoom out" data-i18n-title>−</button>
        <button id="zoomFit" title="See the whole floor" data-i18n-title>⤢</button>
      </div>
      <div class="tip" id="tip" hidden></div>
    </div>
    <div class="hint-row"><div class="hint-map" data-i18n>Drag to move · mouse wheel to zoom · click a person for details</div><div class="legend" id="legend"></div></div>
  </main>
  <aside class="card-detail" id="detail" hidden></aside>
  <script type="module" src="office.js?v=9"></script>
</body>
</html>
