<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office · Tasks</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="icon" href="favicon.png" sizes="32x32">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=23">
</head>
<body>
  <header class="topbar three">
    <div class="tb-left">
      <div class="brand">OFFICE</div>
      <nav class="nav"><a href="/" data-i18n>Office</a><a href="/tarefas" class="on" aria-current="page" data-i18n>Tasks</a><a href="/dashboard">Dashboard</a><a href="/skills">Skills</a><a href="/graphify">Graphify</a></nav>
    </div>
    <div class="usage" id="usage"></div>
    <div class="tb-right">
      <div class="conn off" id="conn" data-i18n>connecting</div>
    </div>
  </header>
  <main class="dash">
    <div class="filters">
      <input id="q" class="search" type="search" placeholder="Search tasks" data-i18n-placeholder autocomplete="off" aria-label="Search tasks" data-i18n-title>
    </div>
    <section class="cards" id="cards"></section>
    <div class="tk-layout">
      <section class="box">
        <h2 data-i18n>Requests</h2>
        <div class="sub" id="vault"></div>
        <div id="list" class="tk-list"></div>
      </section>
      <section class="box" id="detail" aria-live="polite">
        <p class="muted" data-i18n>Click a request to see its tasks.</p>
      </section>
    </div>
    <p class="muted" id="msg" role="status" aria-live="polite"></p>
  </main>
  <dialog id="dlg" aria-labelledby="dlgTitle" class="tk-dlg">
    <h2 id="dlgTitle"></h2>
    <p id="dlgText"></p>
    <p class="tk-err" id="dlgErr" role="alert"></p>
    <div class="tk-actions"><button type="button" class="btn" id="dlgOk"></button><button type="button" class="btn ghost" id="dlgNo" data-i18n>Back</button></div>
  </dialog>
  <script type="module" src="tarefas.js?v=4"></script>
</body>
</html>
