<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif" role="img" aria-label="How the IA Office team works: the Lead reads the Graphify graph, triggers skills and delegates to the Architect, Developer, Security and Reviewer">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a8fa8"/></marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#1c1b2b"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#f4c542">How a request flows through the team</text>

  <g font-size="13" fill="#e8e8f2" text-anchor="middle">
    <rect x="30" y="70" width="150" height="92" rx="10" fill="#d97757"/>
    <text x="105" y="98" font-weight="700" font-size="15" fill="#1c1b2b">You</text>
    <text x="105" y="120" fill="#1c1b2b">any language</text>
    <text x="105" y="140" fill="#1c1b2b">asks for something</text>

    <rect x="230" y="70" width="190" height="92" rx="10" fill="#6a4c93"/>
    <text x="325" y="96" font-weight="700" font-size="15">Lead (office-ceo)</text>
    <text x="325" y="118">1. reads the Graphify graph</text>
    <text x="325" y="136">2. triggers the skills</text>
    <text x="325" y="154">3. plans and delegates in English</text>

    <rect x="470" y="70" width="220" height="92" rx="10" fill="#3d5a80"/>
    <text x="580" y="96" font-weight="700" font-size="15">Joaquim (office-architect)</text>
    <text x="580" y="118">spec, contracts, ADRs</text>
    <text x="580" y="136">owns the graph and</text>
    <text x="580" y="154">writes the team's skills</text>

    <rect x="740" y="70" width="190" height="92" rx="10" fill="#4a90e2"/>
    <text x="835" y="96" font-weight="700" font-size="15">Igor (office-dev)</text>
    <text x="835" y="118">front-end + back-end</text>
    <text x="835" y="136">21st.dev components</text>
    <text x="835" y="154">unit tests, local DB only</text>

    <rect x="470" y="230" width="220" height="92" rx="10" fill="#5aa13e"/>
    <text x="580" y="256" font-weight="700" font-size="15" fill="#10240a">Leonardo (office-security)</text>
    <text x="580" y="278" fill="#10240a">threat model, OWASP, LGPD</text>
    <text x="580" y="296" fill="#10240a">integration, E2E and</text>
    <text x="580" y="314" fill="#10240a">regression tests</text>

    <rect x="740" y="230" width="190" height="92" rx="10" fill="#ffb703"/>
    <text x="835" y="256" font-weight="700" font-size="15" fill="#2b1d00">Lucas (office-reviewer)</text>
    <text x="835" y="278" fill="#2b1d00">5-axis review, skills gate</text>
    <text x="835" y="296" fill="#2b1d00">Claude Security audit</text>
    <text x="835" y="314" fill="#2b1d00">commit commands</text>

    <rect x="230" y="230" width="190" height="92" rx="10" fill="#2a2940" stroke="#8a8fa8"/>
    <text x="325" y="256" font-weight="700" font-size="15">Your commit</text>
    <text x="325" y="278">only you commit and push</text>
    <text x="325" y="296">ready-to-paste commands</text>
    <text x="325" y="314">arrive with the report</text>
  </g>

  <g stroke="#8a8fa8" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M180 116H228"/>
    <path d="M420 116H468"/>
    <path d="M690 116H738"/>
    <path d="M835 162V228"/>
    <path d="M738 276H692"/>
    <path d="M470 276H422"/>
  </g>

  <g font-size="13" fill="#e8e8f2">
    <rect x="30" y="360" width="900" height="86" rx="10" fill="#26253a"/>
    <text x="48" y="386" font-weight="700" fill="#f4c542">Always on, for every agent</text>
    <text x="48" y="408"><tspan font-weight="700">Graphify</tspan> first: graph, report, then the files it points to.</text>
    <text x="48" y="428"><tspan font-weight="700">Skills by trigger</tspan> (Agent Skills, Matt Pocock, Context7, 21st.dev).</text>
    <text x="560" y="408"><tspan font-weight="700">Sonnet</tspan> by default, <tspan font-weight="700">Opus</tspan> only when needed.</text>
    <text x="560" y="428"><tspan font-weight="700">Own skills:</tspan> a repeated way of working becomes a project skill.</text>
  </g>
</svg>
